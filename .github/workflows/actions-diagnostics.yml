name: Diagnose scheduled workflows
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read GitHub scheduling metadata
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_MONITOR_ENABLED: ${{ vars.OPS_MONITOR_ENABLED }}
          OPS_BACKUP_ENABLED: ${{ vars.OPS_BACKUP_ENABLED }}
        run: node ops/diagnose-actions.mjs
      - name: Preserve scheduling diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-diagnostics-${{ github.run_id }}
          path: .ops-state/actions-diagnostics.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
