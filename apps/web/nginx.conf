map $http_x_forwarded_proto $extraok_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 256k;

    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $extraok_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Powered-By;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        access_log off;
        proxy_pass http://api:3333/health;
    }

    location = /ready {
        access_log off;
        proxy_pass http://api:3333/ready;
    }

    location = /api {
        return 308 /api/;
    }

    # Approval URLs contain bearer tokens. Keep them out of normal access logs.
    location ^~ /api/v1/public/approvals/ {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://api:3333;
    }

    location /api/ {
        proxy_pass http://api:3333;
    }

    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ^~ /aprovar/ {
        access_log off;
        error_log /dev/stderr crit;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ @spa;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        access_log off;
        expires -1;
        try_files /index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
